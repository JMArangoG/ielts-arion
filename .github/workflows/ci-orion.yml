# CI ORION â€” puerta de calidad en cada PR hacia main/develop
name: CI ORION
on:
  pull_request:
    branches: [main, develop]

jobs:
  calidad:
    runs-on: ubuntu-latest
    steps:
      - name: CÃ³digo fuente
        uses: actions/checkout@v4

      # Node fijado: builds reproducibles entre local, CI y plataforma
      - name: Node 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # SIN "version": el action lee packageManager desde package.json.
      # Fuente Ãºnica de verdad â†’ evita ERR_PNPM_BAD_PM_VERSION.
      - name: pnpm (versiÃ³n desde packageManager)
        uses: pnpm/action-setup@v4

      # Lockfile inmutable: cualquier deriva rompe el build temprano
      - name: Dependencias
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Build de producciÃ³n
        run: pnpm build
